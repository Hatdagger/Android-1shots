<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Punch Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: loud slapstick arcade, cartoon not gore
IDEA: first-person boxing ring, endless line of smug faces
PICTURE: the face filling the stage, your red gloves in the corners
COLOUR/TYPE: ring blue, rope red, glove red, coin gold; Bungee + Rubik
LAYOUT: slim HUD, full stage, two upgrade buttons under the thumb */
:root{color-scheme:dark;--bg:#0e1730;--ink:#fff6e5;--gold:#ffc53d;--red:#e63946;--btn:#1f3363}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Rubik,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px;flex-wrap:wrap}
h1{font:400 22px/1 Bungee,sans-serif;margin:0;color:var(--gold)}
.hud{display:flex;gap:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud b{color:var(--gold)}
.stage{position:relative;flex:1;min-height:300px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.shop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
button{font:700 15px/1.2 Rubik,sans-serif;min-height:54px;border:0;border-radius:12px;background:var(--btn);color:var(--ink);padding:8px 12px;text-align:left;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
button small{display:block;font-weight:500;font-size:13px;opacity:.85}
button small b{color:var(--gold)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>
<div class="app">
<header><h1>Punch Line</h1>
<div class="hud"><span>KOs <b id="kos">0</b></span><span>Coins <b id="coins">0</b></span></div></header>
<div class="stage"><canvas id="c" aria-label="Tap the face to punch"></canvas></div>
<div class="shop">
<button id="bGlove">Heavier gloves<small id="sGlove"></small></button>
<button id="bBuddy">Sparring buddy<small id="sBuddy"></small></button>
</div></div>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=320,H=420,D=1;
const size=()=>{D=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width||320;H=r.height||420;cv.width=Math.round(W*D);cv.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)};
if(window.ResizeObserver){const ro=new ResizeObserver(size);ro.observe(cv)}else window.addEventListener('resize',size);size();
const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=n=>Math.random()*n,pick=a=>a[Math.floor(Math.random()*a.length)],TAU=Math.PI*2;
const SKIN=['#f6d2b5','#eebd96','#d9a066','#b97a4b','#8d5a3b','#5e3b26','#f3c98b'];
const HAIR=['#2b1d14','#5a3214','#d9a441','#b5462b','#ddd6c8','#151515','#7a4fd0','#2a9d8f'];
const SHIRT=['#3a86ff','#ff006e','#8338ec','#fb5607','#06a77d','#ffbe0b','#6c757d','#e5e5e5'];
const FIRST=['Gary','Doug','Brenda','Kevin','Marge','Todd','Carl','Denise','Rick','Linda','Barry','Steve','Pam','Chad','Gloria','Darryl','Becky','Lyle'];
const ROLE=['from Accounting','the Mime','the Mall Cop','who Reclines','the Sales Guy','from the HOA','who Spoils Movies','the Mascot','with a Hot Take','the Loud Chewer','the Reply-All Guy','who Parks in Two Spots','the Crypto Bro','the Line Cutter','the Speakerphone Talker'];
const WORDS=['BAP!','WHAM!','SMACK!','BOP!','THWACK!','POP!','BONK!'];
let S={coins:0,kos:0,glove:1,buddy:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('punchline')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('punchline',JSON.stringify(S))}catch(e){}};
const shade=(h,a)=>{const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v*a)));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
const crowd=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:.6+Math.random()*.6,f:0}));

const COAT=['#8b5a2b','#5c3a1e','#d9b38c','#f2ede4','#3b2a20','#a0522d','#c9c1b6'],MANE=['#1b1209','#f5e6c8','#3b2a20','#6b4423','#e8e1d4'];
const hname=k=>k==='pony'?pick(['Buttercup','Pickles','Sir Trots-a-Lot','Muffin','Sprinkles'])+' the Pony':k==='big'?'Big '+pick(['Clyde','Brenda','Tank','Moose','Hank'])+' the Clydesdale':pick(['Hay Steve','Gallop Gary','Neigh-bor Doug','Mane Event','Old Oats'])+' the Horse';
const NAMES={
  nerd:()=>pick(['Melvin','Poindexter','Gordon','Wendell','Milton','Doris'])+' '+pick(['the Mathlete','the Chess Club Captain','with the Calculator Watch','Who Says "Well, Actually"','Who Corrects Your Grammar']),
  old:()=>pick(['Grandpa Earl','Grandma Edna','Old Man Jenkins','Mabel','Walter','Aunt Bertha'])+' '+pick(['Who Yells at Clouds','with the Coupons','Who Drives 20 in a 65','from the Bingo Hall','Who Remembers When This Was All Fields']),
  pirate:()=>pick(['Captain','First Mate','Salty','Peg-Leg','Bosun'])+' '+pick(['Barnacle Bill','Redbeard','Scurvy Pete','One-Eyed Jack','Bilgewater']),
  sad:()=>pick(['Gloomy Gus','Weepy Wanda','Mopey Mike','Sad Sam','Teary Terry'])+' '+pick(['Who Got Dumped','Whose Ice Cream Fell','Who Missed the Bus','Whose Team Lost','on a Monday']),
  normal:()=>pick(FIRST)+' '+pick(ROLE),
  barista:()=>pick(['Skyler','Brynn','Jaxon','Mo','Kenzie'])+' '+pick(['the Barista Who Spelled Your Name Wrong','the Barista Out of Oat Milk','the Latte Art Barista','Who Calls Everyone "Friend"']),
  trick:()=>pick(['Dave','Kyle','Brenda','Ron','Sheila'])+', '+(35+Math.floor(rnd(25)))+', Still Trick-or-Treating',
  foot:()=>pick(["Gary's Left Foot",'A Sweaty Foot',"Somebody's Big Toe","Grandpa's Bunion",'A Foot (No Sock)','The Foot That Stepped on Your Shoe']),
  pinata:()=>pick(['The Birthday Piñata','A Suspiciously Heavy Piñata','Piñata (Donkey Model)','The Piñata Nobody Could Break']),
  dishes:()=>pick(['A Stack of Dishes',"Grandma's Good China",'The Dirty Dishes','Fancy Plates (Do Not Touch)'])};
const LOCS=[
  {id:'park',name:'The Theme Park',w:{normal:4,nerd:2,sad:2,pinata:2,horse:1,foot:1,pirate:1,old:1}},
  {id:'grocery',name:'The Grocery Store',w:{normal:4,old:3,sad:2,nerd:1,dishes:1,foot:1,pirate:1}},
  {id:'dmv',name:'The DMV',w:{sad:4,old:3,normal:3,nerd:2,foot:1,pirate:1}},
  {id:'library',name:'The Library',w:{nerd:4,old:3,normal:2,sad:1,foot:1,pirate:1}},
  {id:'cemetery',name:'The Cemetery',w:{sad:5,old:3,pirate:1,normal:1,foot:1,horse:1}},
  {id:'restaurant',name:'The Restaurant',w:{normal:4,dishes:4,old:2,nerd:1,foot:1,pirate:1}},
  {id:'coffee',name:'The Coffee Shop',w:{barista:5,nerd:2,normal:3,sad:1,dishes:1,foot:1}},
  {id:'halloween',name:'Trick-or-Treat Street',w:{trick:7,pinata:2,pirate:1,foot:1,horse:1}}];
const loc=()=>LOCS[Math.floor(S.kos/5)%LOCS.length];
const wpick=w=>{let s=0;for(const k in w)s+=w[k];let r=Math.random()*s;for(const k in w){r-=w[k];if(r<0)return k}return'normal'};
const PCOL=['#ff006e','#ffbe0b','#3a86ff','#06d6a0','#fb5607','#8338ec'];
const mk=()=>{const side=Math.random()<.5?-1:1,kind=wpick(loc().w),obj=['foot','pinata','dishes'].includes(kind);let costume=null;
  const horse=kind==='horse',hk=horse?pick(['pony','horse','big']):null,sc=hk==='pony'?.78:hk==='big'?1.28:1;
  const max=4;
  let h=!horse&&Math.random()<.3?{k:pick(['cap','beanie','top']),c:pick(SHIRT)}:null,hair=pick(HAIR),hs=Math.floor(rnd(5)),glasses=!horse&&Math.random()<.4,stache=!horse&&Math.random()<.3,shirt=pick(SHIRT);
  if(kind==='nerd'){glasses=true;hs=1;h=null;shirt=pick(['#f1f1f1','#c8e6c9','#ffe8a3'])}
  if(kind==='old'){hair=pick(['#ddd6c8','#bdbdbd','#f5f5f5']);hs=pick([0,0,1]);stache=Math.random()<.4;h=Math.random()<.25?{k:'beanie',c:'#8d6e63'}:null}
  if(kind==='pirate'){hair=pick(['#2b1d14','#151515','#b5462b']);hs=pick([1,3]);glasses=false;stache=true;h={k:pick(['bandana','tricorn']),c:'#c1121f'}}
  if(kind==='sad'){h=Math.random()<.3?{k:'beanie',c:'#5c6b8a'}:null;shirt=pick(['#5c6b8a','#6c757d','#3d5a80'])}
  if(kind==='barista'){h={k:'cap',c:'#3b2a20'};shirt=pick(['#f1f1f1','#2b2b2b'])}
  if(kind==='trick'){costume=pick(['witch','vampire','horns','catears']);h=costume==='vampire'?null:{k:costume,c:'#2b2b2b'};glasses=false;if(costume==='vampire'){hair='#151515';hs=1;shirt='#151515'}}
  if(obj){glasses=false;h=null;stache=false}
  return{kind,obj,costume,stack:Array.from({length:4},()=>pick(['plate','plate','bowl','cup'])).sort((a,b)=>'platebowlcup'.indexOf(a)-'platebowlcup'.indexOf(b)),toeR:[],horse,hk,sc,coat:pick(COAT),mane:pick(MANE),blaze:Math.random()<.55,ex:horse?.4:.33,ey:horse?-.38:-.12,ny:horse?.66:.14,my:horse?.9:.46,ry:horse?1.15:kind==='pinata'?1.05:kind==='dishes'?.9:1,
  skin:pick(SKIN),hair,hs,shirt,glasses,gl:[],glOff:false,hat:h,patch:Math.random()<.5?0:1,
  stache,fw:kind==='foot'?.62:kind==='pinata'?.95:kind==='dishes'?.85:horse?.5+rnd(.08):.76+rnd(.14),hp:max,max,marks:[],eyeB:[0,0],blood:0,teeth:[],side,x:side*1.2,state:'in',shake:0,rot:0,ouch:0,vx:0,
  name:horse?hname(hk):NAMES[kind]()}};
let npc=mk(),combo=0,lastHit=0,parts=[],pops=[],which=0,buddyAcc=0,koFlash=0,started=false,t=0;
const fists=[{p:-1,tx:0,ty:0,big:false},{p:-1,tx:0,ty:0,big:false}];
const geom=()=>{const R=Math.min(W*.3,H*.25)*(npc.horse?npc.sc*.85:1);return{cx:W/2+npc.x*W,cy:H*.47+(npc.horse?R*.15:0),R}};

let ac=null;
const thud=big=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.setValueAtTime(big?150:230,n);o.frequency.exponentialRampToValueAtTime(38,n+.16);
  g.gain.setValueAtTime(big?.7:.45,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+.22)}catch(e){}};
const VOW={oo:[[350,800],[330,760]],ow:[[750,1150],[380,800]],ah:[[780,1220],[700,1100]],ee:[[320,2300],[290,2100]],arr:[[650,1150],[560,1250]],whin:[[900,2000],[700,1600]]};
let lastV=null;
const voice=(n,ko)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const T=ac.currentTime;
  if(lastV){try{lastV.g.gain.cancelScheduledValues(T);lastV.g.gain.setTargetAtTime(0,T,.01);lastV.o.stop(T+.05)}catch(e){}}
  const k=n.horse?'horse':n.kind,P={normal:[150,pick(['ow','oo','ah']),0,0],nerd:[300,pick(['ee','ow']),0,0],old:[115,pick(['oo','ow']),6,.08],pirate:[95,'arr',28,.12],sad:[230,'ow',4,.12],horse:[n.hk==='pony'?560:n.hk==='big'?260:380,'whin',14,.15]}[k]||[k==='trick'?170:160,pick(['ow','oo','ah']),0,0];
  const p=P[0]*(.9+rnd(.25)),v=VOW[P[1]],dur=(k==='horse'?.45:.24+rnd(.08))*(ko?2:1);
  const o=ac.createOscillator(),g=ac.createGain(),f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter();o.type='sawtooth';
  [[f1,0],[f2,1]].forEach(([f,i])=>{f.type='bandpass';f.Q.value=7;f.frequency.setValueAtTime(v[0][i],T);f.frequency.linearRampToValueAtTime(v[1][i],T+dur);o.connect(f);f.connect(g)});
  o.frequency.setValueAtTime(p*(k==='horse'?1.3:1.15),T);o.frequency.exponentialRampToValueAtTime(p*(ko?.55:.75),T+dur);
  if(P[2]){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=P[2];lg.gain.value=p*P[3];l.connect(lg).connect(o.frequency);l.start(T);l.stop(T+dur+.05)}
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(.55,T+.015);g.gain.exponentialRampToValueAtTime(.001,T+dur);
  g.connect(ac.destination);o.start(T);o.stop(T+dur+.05);lastV={o,g}}catch(e){}};
const noise=(dur,freq,q,vol)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**2;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=vol;s.connect(f).connect(g).connect(ac.destination);s.start()}catch(e){}};
const ring=(fq,dur,vol)=>{try{const T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(fq,T);o.frequency.linearRampToValueAtTime(fq*.94,T+dur);g.gain.setValueAtTime(vol,T);g.gain.exponentialRampToValueAtTime(.001,T+dur);o.connect(g).connect(ac.destination);o.start(T);o.stop(T+dur)}catch(e){}};
const smash=()=>{noise(.4,3800,.7,1.2);ring(2600+rnd(600),.3,.12);ring(3900+rnd(500),.2,.08)};
const crunch=()=>{noise(.2,1300,1.1,1.1);noise(.12,600,1.5,.6)};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const burst=(x,y,type,n,sp)=>{for(let i=0;i<n;i++){const a=rnd(TAU),v=sp*(.4+rnd(.8));parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(type==='star'?0:sp*.5),type,life:1,r:rnd(TAU),vr:rnd(20)-10})}};
const pop=(x,y,txt,sz,col)=>pops.push({x,y,txt,sz,col,t:0});

const strike=(tx,ty,auto)=>{
  if(npc.state==='out'||Math.abs(npc.x)>.3)return;
  const f=geom(),dx=(tx-f.cx)/f.R,dy=(ty-f.cy)/f.R;
  const n=npc;if((dx/n.fw)**2+(dy/n.ry)**2>1.15){if(!auto)pop(tx,ty,'whiff',16,'#9fb3d9');return}
  started=true;const now=performance.now();combo=now-lastHit<850?combo+1:1;lastHit=now;
  const fin=!auto&&combo%10===0,earn=(auto?1:S.glove)*(fin?3:1)*(1+Math.floor(combo/10)*.25);
  npc.hp-=1;npc.shake=fin?1.6:1;npc.ouch=.2;S.coins+=Math.ceil(earn);
  const d=(a,b)=>Math.hypot(dx-a,dy-b),bruise=()=>{const m=n.marks.find(m=>Math.hypot(m.x-dx,m.y-dy)<.2);if(m)m.s=Math.min(m.s+.08,.34);else n.marks.push({x:dx,y:dy,s:.15})};
  if(n.kind==='dishes'){const it=n.stack.pop()||'plate';for(let k=0;k<12;k++)parts.push({x:tx+rnd(50)-25,y:ty,vx:rnd(700)-350,vy:-rnd(500)-100,type:'shard',life:1.3,r:rnd(TAU),vr:rnd(30)-15});pop(tx,ty-44,it==='cup'?'CLINK!':'CRASH!',30,'#bde0fe')}
  else if(n.kind==='pinata'){n.marks.push({x:dx,y:dy,s:.09+rnd(.06)});for(let k=0;k<9;k++)parts.push({x:tx,y:ty,vx:rnd(500)-250,vy:-rnd(400),type:'paper',c:pick(PCOL),life:1.5,r:rnd(TAU),vr:rnd(20)-10})}
  else if(n.kind==='foot'){let h=-1;toes(n).forEach((q,i)=>{if(Math.hypot(dx-q[0],dy-q[1])<q[2]+.09)h=i});
    if(h>=0){n.toeR[h]=1;if(!n.teeth.includes(h)){n.teeth.push(h);parts.push({x:tx,y:ty,vx:rnd(300)-150,vy:-380,type:'nail',life:1.4,r:0,vr:rnd(30)-15,R:f.R});pop(tx,ty-40,'TOENAIL!',18,'#ffc8dd')}}
    else bruise()}
  else if(d(0,n.ny)<(n.horse?.24:.17)){npc.blood=Math.min(npc.blood+2,6);burst(tx,ty,'drop',7,260)}
  else if(d(-n.ex,n.ey)<.22||d(n.ex,n.ey)<.22){const e=dx<0?0:1;
    if(n.kind==='pirate'&&e===n.patch)npc.marks.push({x:dx,y:dy,s:.16});
    else if(npc.glasses&&!npc.glOff){npc.gl.push({x:dx,y:dy,a:Array.from({length:5},()=>rnd(TAU))});
      if(npc.gl.length>=2){npc.glOff=true;parts.push({x:f.cx,y:f.cy-f.R*.12,vx:(dx<0?1:-1)*(200+rnd(150)),vy:-420,type:'glass',life:1.6,r:0,vr:(dx<0?1:-1)*9,R:f.R});pop(f.cx,f.cy-f.R*.5,'SPECTACLES!',20,'#8ecae6')}}
    else npc.eyeB[e]=Math.min(npc.eyeB[e]+2,4)}
  else if(n.kind==='old'&&d(0,n.my)<.18&&!n.teeth.length){n.teeth=[0,1,2,3,4,5];parts.push({x:tx,y:ty,vx:rnd(300)-150,vy:-450,type:'denture',life:1.8,r:0,vr:rnd(16)-8,R:f.R});pop(tx,ty-40,'DENTURES!',20,'#ffb4c2')}
  else if(d(0,n.my)<(n.horse?.2:.18)&&npc.teeth.length<5){for(let k=0;k<2&&npc.teeth.length<5;k++){let i;do{i=Math.floor(rnd(6))}while(npc.teeth.includes(i));npc.teeth.push(i);
    parts.push({x:tx,y:ty,vx:rnd(300)-150,vy:-350,type:'tooth',life:1.4,r:0,vr:rnd(30)-15,R:f.R})}}
  else bruise();
  if(n.kind==='barista')burst(tx,ty,'coffee',7,280);
  if(!n.obj&&Math.random()<.5)burst(f.cx+rnd(f.R)-f.R/2,f.cy-f.R*.6,'sweat',2,180);
  burst(tx,ty,'star',fin?8:3,fin?420:240);
  pop(tx,ty-10,auto?'jab':fin?'POW!!':pick(WORDS),auto?14:fin?40:26,auto?'#cfe1ff':fin?'#ffc53d':'#fff6e5');
  thud(fin);if(n.kind==='dishes')smash();else if(n.kind==='pinata')crunch();else voice(n,npc.hp<=0);if(!auto)buzz(fin?40:12);
  if(npc.hp<=0){npc.state='out';npc.vx=(Math.abs(dx)<.1?(Math.random()<.5?-1:1):-Math.sign(dx))*2.4;
    const prize=Math.round((8+Math.min(S.kos,100)*.3)*(n.horse?n.sc*1.5:1)*(n.kind==='pinata'?2:1));S.coins+=prize;S.kos++;
    if(n.kind==='pinata'){for(let k=0;k<34;k++)parts.push({x:f.cx,y:f.cy,vx:rnd(900)-450,vy:-rnd(700)-100,type:'candy',c:pick(PCOL),life:2,r:rnd(TAU),vr:rnd(20)-10});pop(W/2,H*.3-52,'CANDY!',30,'#ffbe0b')}
    if(S.kos%5===0){pop(W/2,H*.5,'NEXT STOP',22,'#ffc53d');pop(W/2,H*.5+28,loc().name,20,'#fff6e5')}koFlash=1;pop(W/2,H*.3,'K.O.!',64,'#e63946');pop(W/2,H*.3+46,'+'+prize+' coins',20,'#ffc53d');
    burst(f.cx,f.cy-f.R,'star',12,380);thud(true);buzz(60);save()}
};
const tap=(x,y)=>{let i=which;if(fists[i].p>=0&&fists[1-i].p<0)i=1-i;which=1-i;
  const fin=(combo+1)%10===0&&performance.now()-lastHit<850;fists[i]={p:0,tx:x,ty:y,big:fin};strike(x,y,false)};
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)});

const costG=()=>Math.round(25*1.6**(S.glove-1)),costB=()=>Math.round(40*1.7**S.buddy);
const bG=document.getElementById('bGlove'),bB=document.getElementById('bBuddy');
bG.onclick=()=>{if(S.coins>=costG()){S.coins-=costG();S.glove++;save()}};
bB.onclick=()=>{if(S.coins>=costB()){S.coins-=costB();S.buddy++;save()}};

  if(combo>1&&performance.now()-lastHit<850){ctx.font=`${Math.min(40,18+combo)}px Bungee, Impact, sans-serif`;ctx.textAlign='right';ctx.lineWidth=6;ctx.strokeStyle='#120a1f';ctx.strokeText(combo+'x',W-14,y+70);ctx.fillStyle=combo>=10?'#e63946':'#ffc53d';ctx.fillText(combo+'x',W-14,y+70);
    ctx.font='12px Bungee, sans-serif';ctx.fillStyle='#fff6e5';ctx.fillText('COMBO',W-14,y+86)}
  if(!started){ctx.font='20px Bungee, sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#120a1f';ctx.strokeText('TAP TO PUNCH',W/2,H*.83);ctx.fillStyle=`rgba(255,246,229,${.7+Math.sin(t*4)*.3})`;ctx.fillText('TAP TO PUNCH',W/2,H*.83)}};

let last=performance.now();
const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;const n=npc;
  if(n.state==='in'){n.x+=(0-n.x)*Math.min(1,dt*7);if(Math.abs(n.x)<.004){n.x=0;n.state='fight';if(n.horse)pop(W/2,H*.25,n.hk==='pony'?'neigh?':'NEIGH!',n.hk==='big'?44:28,'#f5e6c8')}}
  if(n.state==='out'){n.x+=n.vx*dt;n.rot+=n.vx*dt*2.5;if(Math.abs(n.x)>1.4)npc=mk()}
  n.shake=Math.max(0,n.shake-dt*5);n.ouch=Math.max(0,n.ouch-dt);
  for(const f of fists)if(f.p>=0){f.p+=dt/.17;if(f.p>=1)f.p=-1}
  if(S.buddy&&n.state==='fight'){buddyAcc+=dt*S.buddy;while(buddyAcc>=1){buddyAcc--;const g=geom();strike(g.cx+(rnd(1.2)-.6)*g.R*n.fw,g.cy+(rnd(1.4)-.7)*g.R,true)}}
  bg();face();drawFists();fx(dt);top();
  if(koFlash>0){ctx.fillStyle=`rgba(255,255,255,${koFlash*.35})`;ctx.fillRect(0,0,W,H);koFlash-=dt*3}
  requestAnimationFrame(loop)};
requestAnimationFrame(loop);
}
