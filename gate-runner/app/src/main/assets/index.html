<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gate Runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1a2b; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { position: relative; height: 100%; max-width: 520px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 16, 30, .62); }
  #ui.hide { display: none; }
  #card { width: 78%; max-width: 340px; background: #f7f3e8; color: #1b2b44; border-radius: 18px; padding: 24px 20px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  #card h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .5px; }
  #card p { margin: 0 0 18px; font-size: 16px; line-height: 1.4; color: #40516b; }
  #card button { font: inherit; font-weight: 700; font-size: 18px; color: #fff; background: #1f6fe5; border: 0; border-radius: 12px; padding: 14px 26px; min-width: 60%; box-shadow: 0 4px 0 #1550ab; }
  #card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1550ab; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="card">
      <h1 id="title">Gate Runner</h1>
      <p id="msg">Drag left and right to steer your squad. Pick the better gate and outnumber the red squads. If the giant popstar shows up, dodge her boots. The path never ends, so see how far you get.</p>
      <button id="btn">Play</button>
    </div>
  </div>
</div>
<script>
(function () {
  var cv = document.getElementById('c'), g = cv.getContext('2d');
  var ui = document.getElementById('ui'), titleEl = document.getElementById('title'),
      msgEl = document.getElementById('msg'), btn = document.getElementById('btn');
  var W = 0, H = 0, DPR = 1;
  if (!g.ellipse) g.ellipse = function (x, y, rx, ry, rot, a0, a1) {   // very old Android WebViews
    this.save(); this.translate(x, y); this.rotate(rot); this.scale(rx, ry); this.arc(0, 0, 1, a0, a1); this.restore();
  };
  var F = 12, FAR = 150, NEAR = -5, MEET = 3.6;

  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- state ----------
  var best = 0;
  try { best = parseInt(localStorage.getItem('gr_best_m') || '0', 10) || 0; } catch (e) {}
  var state = 'menu';            // menu | play | lose
  var dist = 0, count = 5, px = 0, items = [], pops = [], parts = [], shake = 0, time = 0;
  var nextZ = 34, wantFoe = false, since = 0, gatesMade = 0, wins = 0, fight = null, star = null, nextStar = 260;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function apply(op, n) {
    if (op.t === '+') return n + op.v;
    if (op.t === '-') return n - op.v;
    if (op.t === 'x') return n * op.v;
    return Math.ceil(n / op.v);
  }
  function label(op) { return ({ '+': '+', '-': '−', 'x': '×', '/': '÷' })[op.t] + op.v; }
  function good(op) { return op.t === '+' || op.t === 'x'; }
  function diff(z) { return Math.min(1, z / 1600); }
  function five(v) { return Math.max(5, 5 * Math.ceil(v / 5)); }

  function makePair(n, d, first) {
    var add = function () { return { t: '+', v: Math.min(250, five(n * rnd(0.3, 1.6))) }; };
    var mul = function () { return { t: 'x', v: Math.random() < 0.2 ? 3 : 2 }; };
    var sub = function () { return { t: '-', v: five(n * rnd(0.2, 0.8)) }; };
    var div = function () { return { t: '/', v: 2 }; };
    var a, b, r = Math.random(), gg = 0.55 - 0.2 * d;
    if (r < gg || first) {
      a = add();
      if (n > 400) { b = add(); while (b.v === a.v) b = { t: '+', v: a.v + 5 * Math.ceil(Math.random() * 6) }; } else b = mul();
    } else if (r < gg + 0.3) {
      a = (n > 400 || Math.random() < 0.5) ? add() : mul();
      b = Math.random() < 0.5 ? sub() : div();
    } else { a = sub(); b = div(); }
    return Math.random() < 0.5 ? [a, b] : [b, a];
  }
  // a row of gates: two lanes at first, three once 20 rows have gone by
  function makeRow(n, d, first, three) {
    var ops = makePair(n, d, first);
    if (three) {
      var r = Math.random(), c;
      if (r < 0.35) c = { t: '+', v: Math.min(250, five(n * rnd(0.3, 1.6))) };
      else if (r < 0.55 && n <= 400) c = { t: 'x', v: 2 };
      else if (r < 0.8) c = { t: '-', v: five(n * rnd(0.2, 0.8)) };
      else c = { t: '/', v: Math.random() < 0.5 ? 2 : 3 };
      ops.splice(Math.floor(Math.random() * 3), 0, c);
    }
    return ops;
  }
  function lane(it) { return Math.max(0, Math.min(it.ops.length - 1, Math.floor((px + 1) / 2 * it.ops.length))); }

  // best squad size reachable from right now through everything already on the path
  function sim() {
    var n = count;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.used) continue;
      if (it.k === 'gate') { var m = -Infinity; for (var q = 0; q < it.ops.length; q++) m = Math.max(m, apply(it.ops[q], n)); n = m; }
      else n -= it.n;
    }
    return Math.max(1, n);
  }

  function spawn() {
    var n = sim(), d = diff(nextZ);
    if (wantFoe) {
      var e = Math.max(1, Math.floor(n * rnd(0.25 + d * 0.3, 0.5 + d * 0.35)));
      items.push({ k: 'foe', z: nextZ, n: e, x: 0, used: false });
      wantFoe = false; since = 0; nextZ += 16;
    } else {
      items.push({ k: 'gate', z: nextZ, ops: makeRow(n, d, gatesMade === 0, gatesMade >= 20), used: false });
      gatesMade++; since++;
      if (since >= 2 || Math.random() < 0.3) { wantFoe = true; nextZ += 15; } else nextZ += 9;
    }
  }

  function reset() {
    items = []; pops = []; parts = []; fight = null; star = null; nextStar = 260;
    dist = 0; count = 5; px = 0; shake = 0; wins = 0;
    nextZ = 34; wantFoe = false; since = 0; gatesMade = 0;
    while (nextZ < FAR + 20) spawn();
  }

  // ---------- audio (tiny beeps) ----------
  var ac = null;
  function beep(f, d, type) {
    if (!ac) return;
    try {
      var o = ac.createOscillator(), v = ac.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      v.gain.value = 0.05; v.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(v); v.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }

  // her song: an original tune, sung by a synth voice over a simple bass line
  var song = null;
  function stopSong() {
    if (song && ac) { try { song.gain.cancelScheduledValues(ac.currentTime); song.gain.setTargetAtTime(0, ac.currentTime, 0.08); } catch (e) {} }
    song = null;
  }
  function voice(out, f, t, len, vowel) {
    var o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), v = ac.createGain();
    var f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f;
    lfo.frequency.value = 5.5; lg.gain.value = 6; lfo.connect(lg); lg.connect(o.frequency);
    f1.type = 'bandpass'; f1.frequency.value = vowel ? 750 : 520; f1.Q.value = 5;
    f2.type = 'bandpass'; f2.frequency.value = vowel ? 1250 : 1700; f2.Q.value = 6;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(0.9, t + 0.025);
    v.gain.setValueAtTime(0.9, t + len * 0.7); v.gain.linearRampToValueAtTime(0, t + len);
    o.connect(f1); o.connect(f2); f1.connect(v); f2.connect(v); v.connect(out);
    o.start(t); lfo.start(t); o.stop(t + len + 0.02); lfo.stop(t + len + 0.02);
  }
  function tone(out, type, f, t, len, vol) {
    var o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.value = f;
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(v); v.connect(out); o.start(t); o.stop(t + len + 0.02);
  }
  function sing(dur) {
    if (!ac) return;
    stopSong();
    try {
      var out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination); song = out;
      var C = 523.25, D = 587.33, E = 659.25, G = 783.99, A = 880;
      var mel = [E, E, G, E, D, C, D, 0, E, G, A, G, E, 0, D, 0, C, C, E, G, A, G, E, 0, D, E, D, C, C, 0, 0, 0];
      var bass = [130.81, 110, 87.31, 98];
      var st = 0.22, t0 = ac.currentTime + 0.05, steps = Math.floor(dur / st);
      for (var i = 0; i < steps; i++) {
        var t = t0 + i * st, f = mel[i % 32];
        if (f) voice(out, f, t, mel[(i + 1) % 32] ? st * 0.92 : st * 1.8, i % 2);
        if (i % 4 === 0) tone(out, 'triangle', bass[(i / 4) % 4], t, st * 3.5, 0.35);
        if (i % 2 === 0) tone(out, 'square', 2000, t, 0.03, 0.03);
      }
    } catch (e) {}
  }

  // ---------- input ----------
  var lastX = null;
  cv.addEventListener('pointerdown', function (e) { lastX = e.clientX; });
  cv.addEventListener('pointermove', function (e) {
    if (lastX === null || state !== 'play') return;
    if (!fight) px += (e.clientX - lastX) / (W * 0.36) * 1.15;
    lastX = e.clientX;
    px = Math.max(-0.8, Math.min(0.8, px));
  });
  window.addEventListener('pointerup', function () { lastX = null; });
  window.addEventListener('pointercancel', function () { lastX = null; });
  var keys = {};
  window.addEventListener('keydown', function (e) { keys[e.key] = true; });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  btn.addEventListener('click', function () {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    reset(); state = 'play'; ui.className = 'hide';
  });

  function show(t, m, b) { titleEl.textContent = t; msgEl.textContent = m; btn.textContent = b; ui.className = ''; }
  function pop(text, col) { pops.push({ text: text, col: col, t: 0 }); }
  function lose(msg) {
    count = 0; state = 'lose'; stopSong();
    var m = Math.floor(dist), rec = m > best;
    if (rec) { best = m; try { localStorage.setItem('gr_best_m', String(best)); } catch (e) {} }
    show('Squad wiped out', msg + ' You ran ' + m + ' m and beat ' + wins + ' red squad' + (wins === 1 ? '' : 's') + '.' + (rec ? ' New best!' : ''), 'Run again');
  }

  // ---------- update ----------
  var tickAt = 0;
  function update(dt) {
    time += dt;
    for (var i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1) pops.splice(i, 1); }
    for (var q = parts.length - 1; q >= 0; q--) {
      var pt = parts[q]; pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 520 * dt;
      if (pt.t > pt.life) parts.splice(q, 1);
    }
    shake = Math.max(0, shake - dt * 3);
    if (state !== 'play') return;

    if (fight) {                       // squads clash: both sides lose soldiers one for one
      fight.t += dt;
      var k = Math.min(1, fight.t / fight.dur), dead = Math.round(fight.kill * k);
      count = fight.p0 - dead; fight.it.n = fight.e0 - dead;
      shake = Math.max(shake, 0.35);
      if (time > tickAt) { tickAt = time + 0.07; beep(rnd(160, 320), 0.05, 'sawtooth'); }
      // sparks and fallen soldiers flying off between the two squads
      var a = P(px, 0), b = P(fight.it.x, MEET), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 - 10;
      var spawnN = Math.random() < dt * 60 ? 2 : 0;
      for (var s = 0; s < spawnN; s++) {
        var c = Math.random();
        parts.push({ x: mx + rnd(-45, 45), y: my + rnd(-14, 14), vx: rnd(-170, 170), vy: rnd(-330, -120), t: 0,
          life: rnd(0.35, 0.7), r: c < 0.4 ? rnd(2, 4) : 5, col: c < 0.4 ? '#fff3a0' : (c < 0.7 ? '#1f6fe5' : '#d93a3a') });
      }
      if (k >= 1) {
        var it = fight.it; fight = null;
        if (count <= 0) { lose('The red squad had more soldiers than you.'); return; }
        it.used = true; wins++;
        pop('−' + it.lost, '#ff8a80'); beep(700, 0.12);
      }
      return;
    }

    if (keys.ArrowLeft || keys.a) px -= dt * 2.2;
    if (keys.ArrowRight || keys.d) px += dt * 2.2;
    px = Math.max(-0.8, Math.min(0.8, px));
    dist += (7.5 + Math.min(15, dist / 80)) * dt;     // starts slow, tops out around 1,200 m
    while (nextZ < dist + FAR + 20) spawn();
    while (items.length && items[0].z < dist - 12) items.shift();

    // the 100 ft popstar: rises beside the path and stomps the half you are standing on
    if (!star && dist > nextStar) { star = { t: 0, n: dist > 1200 ? 4 : 3, sides: [], hit: [] }; pop('POPSTAR!', '#ff7ad9'); sing(1.6 + star.n * 2 + 1); }
    if (star) {
      star.t += dt;
      for (var si = 0; si < star.n; si++) {
        var t0 = 1.6 + si * 2;
        if (star.t >= t0 && !star.sides[si]) { star.sides[si] = px < 0 ? 'l' : 'r'; beep(1200, 0.08); }
        if (star.t >= t0 + 1.1 && !star.hit[si]) {
          star.hit[si] = true; shake = 1; beep(90, 0.3, 'sawtooth');
          var bp = P(star.sides[si] === 'l' ? -0.5 : 0.5, 1);
          for (var dp = 0; dp < 22; dp++) parts.push({ x: bp[0] + rnd(-60, 60), y: bp[1] + rnd(-10, 20), vx: rnd(-260, 260), vy: rnd(-300, -60), t: 0, life: rnd(0.4, 0.8), r: rnd(3, 7), col: dp % 3 ? '#f4ead2' : '#ff8ccb' });
          if ((px < 0 ? 'l' : 'r') === star.sides[si]) {
            var loss = Math.min(count - 1, Math.ceil(count * 0.4));
            if (loss > 0) { count -= loss; pop('\u2212' + loss + ' stomped!', '#ff8a80'); } else pop('Ouch!', '#ff8a80');
          } else pop('Dodged!', '#7fe0ff');
        }
      }
      if (star.t > 1.6 + star.n * 2 + 1) { star = null; stopSong(); nextStar = dist + 380; }
    }

    for (var j = 0; j < items.length; j++) {
      var o = items[j], z = o.z - dist;
      if (o.used) continue;
      if (o.k === 'foe') {
        if (z < 28) o.x += (px - o.x) * Math.min(1, dt * 4);     // red squad charges at you
        if (z <= MEET) {
          var kill = Math.min(count, o.n);
          o.lost = kill;
          fight = { it: o, t: 0, p0: count, e0: o.n, kill: kill, dur: Math.min(1.5, 0.6 + kill * 0.012) };
          dist = o.z - MEET;
          return;
        }
      } else if (z <= 0) {
        o.used = true;
        o.side = lane(o);
        var op = o.ops[o.side];
        count = apply(op, count);
        pop(label(op), good(op) ? '#7fe0ff' : '#ff8a80');
        beep(good(op) ? 880 : 220, 0.12);
        if (count <= 0) { lose('That gate took your last soldiers.'); return; }
      }
    }
  }

  // ---------- drawing ----------
  var HZ, PY, RW;
  function P(x, z) {
    var s = F / (z + F);
    return [W / 2 + x * RW * s, HZ + (PY - HZ) * s, s];
  }
  function quad(a, b, c, d, col) {
    g.fillStyle = col; g.beginPath();
    g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]);
    g.closePath(); g.fill();
  }
  function soldier(x, y, r, body, head) {
    g.fillStyle = 'rgba(0,0,0,.22)';
    g.beginPath(); g.ellipse(x, y + r * 0.9, r * 0.9, r * 0.35, 0, 0, 7); g.fill();
    g.fillStyle = body;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = head;
    g.beginPath(); g.arc(x, y - r * 1.25, r * 0.62, 0, 7); g.fill();
  }
  // lunge: pixels each soldier jabs toward the enemy during a fight (negative = up the screen)
  function crowd(cx, cy, s, n, body, head, phase, lunge) {
    var shown = Math.min(n, 70), pts = [], r = Math.max(2.5, 6.5 * s);
    for (var i = 0; i < shown; i++) {
      var d = r * 1.25 * Math.sqrt(i), a = i * 2.39996;
      var jab = lunge ? lunge * Math.abs(Math.sin(time * 16 + i * 1.7 + phase)) : 0;
      pts.push([cx + Math.cos(a) * d + (lunge ? Math.sin(time * 23 + i) * 1.5 : 0),
                cy + Math.sin(a) * d * 0.55 - Math.abs(Math.sin(time * 11 + i + phase)) * r * 0.35 + jab]);
    }
    pts.sort(function (p, q) { return p[1] - q[1]; });
    for (var k = 0; k < pts.length; k++) soldier(pts[k][0], pts[k][1], r, body, head);
    var top = cy - r * 1.25 * Math.sqrt(shown) * 0.55 - r * 3.2;
    if (lunge > 0) badge(cx - r * 1.25 * Math.sqrt(shown) - 22, cy - 24, String(n), body, Math.max(11, 17 * s));
    else badge(cx, top, String(n), body, Math.max(11, 17 * s));
  }
  function badge(x, y, text, col, size) {
    g.font = '800 ' + size + 'px system-ui, sans-serif';
    var w = g.measureText(text).width + size * 0.9, h = size * 1.45;
    x = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, x));
    g.fillStyle = col; rr(x - w / 2, y - h / 2, w, h, h / 2); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, x, y + size * 0.05);
  }
  function rr(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function drawGate(it, z) {
    var cnt = it.ops.length, wl = 2 / cnt;
    for (var i = 0; i < cnt; i++) {
      var op = it.ops[i];
      if (it.used && it.side === i) continue;
      var sd = [i, -1 + i * wl, -1 + (i + 1) * wl];
      var a = P(sd[1], z), b = P(sd[2], z), s = a[2], h = 105 * s;
      var gd = good(op);
      g.fillStyle = gd ? 'rgba(40,150,255,.55)' : 'rgba(240,60,60,.55)';
      g.fillRect(a[0], a[1] - h, b[0] - a[0], h);
      g.fillStyle = gd ? '#1565d8' : '#c62828';
      g.fillRect(a[0], a[1] - h, b[0] - a[0], Math.max(2, 9 * s));
      var pw = Math.max(1.5, 5 * s);
      g.fillStyle = '#e9edf5';
      g.fillRect(a[0] - pw / 2, a[1] - h, pw, h); g.fillRect(b[0] - pw / 2, b[1] - h, pw, h);
      var txt = label(op), fs = Math.max(8, (txt.length > 3 ? 32 : 40) * s * (cnt > 2 ? 0.72 : 1));
      g.font = '800 ' + fs + 'px system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillText(txt, (a[0] + b[0]) / 2 + 1, a[1] - h * 0.48 + 2);
      g.fillStyle = '#fff'; g.fillText(txt, (a[0] + b[0]) / 2, a[1] - h * 0.48);
    }
  }

  function starPath(x, y, r) {
    g.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r;
      g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
    }
    g.closePath();
  }
  function limb(x1, y1, x2, y2, w, col) {
    g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }
  function drawStar() {
    var tIn = Math.min(1, star.t / 1.2), tOut = Math.max(0, Math.min(1, star.t - (1.6 + star.n * 2)));
    var vis = (1 - Math.pow(1 - tIn, 3)) * (1 - tOut * tOut);
    var u = W * 0.01, cx = W * 0.8, cy = H * 0.2 + (1 - vis) * H * 0.75 + Math.sin(time * 3) * 4;
    var skin = '#f6c9a4', hair = '#7a3ff2', dress = '#ffd23f';
    // hair behind
    g.fillStyle = hair;
    g.beginPath(); g.arc(cx, cy, 11 * u, 0, 7); g.fill();
    g.beginPath(); g.ellipse(cx - 9 * u, cy + 9 * u, 4.5 * u, 11 * u, 0.15, 0, 7); g.fill();
    g.beginPath(); g.ellipse(cx + 9 * u, cy + 9 * u, 4.5 * u, 11 * u, -0.15, 0, 7); g.fill();
    // dress, widening down into the clouds
    g.fillStyle = dress; g.beginPath();
    g.moveTo(cx - 10 * u, cy + 11 * u); g.lineTo(cx + 10 * u, cy + 11 * u);
    g.lineTo(cx + 15 * u, cy + 60 * u); g.lineTo(cx + 19 * u, H + 40); g.lineTo(cx - 19 * u, H + 40); g.lineTo(cx - 15 * u, cy + 60 * u);
    g.closePath(); g.fill();
    g.fillStyle = '#fff';
    for (var i = 0; i < 14; i++) {
      var tw = Math.abs(Math.sin(time * 4 + i * 1.3));
      g.globalAlpha = tw; starPath(cx + ((i * 37) % 22 - 11) * u, cy + (16 + i * 7) * u, 1.2 * u); g.fill();
    }
    g.globalAlpha = 1;
    g.fillStyle = '#ff3fa4'; g.fillRect(cx - 11 * u, cy + 30 * u, 22 * u, 2.5 * u);
    // neck, head, fringe
    g.fillStyle = skin; g.fillRect(cx - 2.5 * u, cy + 6 * u, 5 * u, 6 * u);
    g.beginPath(); g.arc(cx, cy, 8 * u, 0, 7); g.fill();
    g.fillStyle = hair; g.beginPath(); g.arc(cx, cy - 1.5 * u, 8.6 * u, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
    g.fillStyle = '#ffe14a'; starPath(cx + 6.5 * u, cy - 6.5 * u, 2.4 * u); g.fill();
    // star shades and singing mouth
    g.fillStyle = '#14394a'; starPath(cx - 3.4 * u, cy + 0.5 * u, 2.9 * u); g.fill(); starPath(cx + 3.4 * u, cy + 0.5 * u, 2.9 * u); g.fill();
    g.fillRect(cx - 1.5 * u, cy + 0.1 * u, 3 * u, 0.7 * u);
    g.fillStyle = '#c2185b'; g.beginPath(); g.ellipse(cx, cy + 4.8 * u, 1.6 * u, (0.6 + Math.abs(Math.sin(time * 9)) * 1.2) * u, 0, 0, 7); g.fill();
    // arms: one holds the mic, one waves
    limb(cx - 10 * u, cy + 13 * u, cx - 12 * u, cy + 21 * u, 3.4 * u, skin);
    limb(cx - 12 * u, cy + 21 * u, cx - 5.5 * u, cy + 9 * u, 3.2 * u, skin);
    limb(cx - 5.5 * u, cy + 9.5 * u, cx - 4 * u, cy + 7 * u, 1.3 * u, '#9aa3ad');
    g.fillStyle = '#2b2f36'; g.beginPath(); g.arc(cx - 3.6 * u, cy + 6.2 * u, 1.7 * u, 0, 7); g.fill();
    var wv = Math.sin(time * 6) * 3 * u;
    limb(cx + 10 * u, cy + 13 * u, cx + 15 * u, cy + 6 * u, 3.4 * u, skin);
    limb(cx + 15 * u, cy + 6 * u, cx + 16 * u + wv, cy - 5 * u, 3.2 * u, skin);
    // notes drifting off
    g.font = '800 ' + 5 * u + 'px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (var n = 0; n < 4; n++) {
      var ph = (time * 0.6 + n * 0.25) % 1;
      g.globalAlpha = (1 - ph) * vis; g.fillStyle = n % 2 ? '#ff3fa4' : '#fff';
      g.fillText(n % 2 ? '\u266b' : '\u266a', cx - 8 * u - ph * 22 * u + Math.sin(ph * 9 + n) * 2 * u, cy + 4 * u - ph * 16 * u);
    }
    g.globalAlpha = 1;
  }
  function drawStomps() {
    for (var i = 0; i < star.n; i++) {
      if (!star.sides[i]) continue;
      var lt = star.t - (1.6 + i * 2); if (lt > 1.9) continue;
      var x0 = star.sides[i] === 'l' ? -1 : 0, x1 = x0 + 1;
      var A = P(x0, -3), B = P(x1, -3), C = P(x1, 7), D = P(x0, 7);
      if (lt < 1.1) {                     // warning shadow
        quad(A, B, C, D, 'rgba(255,30,90,' + (0.22 + 0.25 * Math.abs(Math.sin(time * 14))) + ')');
        var m = P(x0 + 0.5, 2);
        g.font = '800 44px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = '#fff'; g.fillText('!', m[0], m[1]);
        continue;
      }
      var down = lt < 1.6 ? Math.min(1, (lt - 1.1) / 0.12) : 1 - (lt - 1.6) / 0.3, yo = -(1 - down) * H;
      var sh = function (p, dy) { return [p[0], p[1] + yo + dy]; };
      quad(sh(A, 14), sh(B, 14), sh(C, 14), sh(D, 14), '#b0126b');
      quad(sh(A, 0), sh(B, 0), sh(C, 0), sh(D, 0), '#ff3fa4');
      var L = P(x0, 3), R = P(x1, 3), top = -H - 40, w = R[0] - L[0];
      g.fillStyle = '#ff3fa4'; g.fillRect(L[0] + w * 0.08, top + yo + H, w * 0.84, L[1] - top - H);
      g.fillStyle = '#ff8ccb'; g.fillRect(L[0] + w * 0.18, top + yo + H, w * 0.12, L[1] - top - H);
      g.fillStyle = '#b0126b'; g.fillRect(L[0] + w * 0.08, L[1] + yo - 10, w * 0.84, 10);
    }
  }

  function draw() {
    HZ = H * 0.27; PY = H * 0.78; RW = W * 0.36;
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#5db4ff'); sky.addColorStop(0.45, '#aee0ff'); sky.addColorStop(1, '#e9f7ff');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.75)';
    for (var c = 0; c < 7; c++) {
      var cy = ((c * 173 + dist * 9) % (H * 0.8)) + H * 0.3, cx = (c * 97 % 100) / 100 * W;
      if (Math.abs(cx - W / 2) < W * 0.2) cx += (cx < W / 2 ? -1 : 1) * W * 0.25;
      var cs = 14 + (cy / H) * 26;
      g.beginPath(); g.ellipse(cx, cy, cs * 1.9, cs * 0.6, 0, 0, 7); g.fill();
    }
    if (star) drawStar();
    g.save();
    if (shake > 0) g.translate(rnd(-5, 5) * shake, rnd(-5, 5) * shake);

    // path
    var a = P(-1, NEAR), b = P(1, NEAR), c2 = P(1, FAR), d = P(-1, FAR), th = 26;
    quad([a[0], a[1] + th * a[2]], [b[0], b[1] + th * b[2]], [c2[0], c2[1] + th * c2[2]], [d[0], d[1] + th * d[2]], '#6b5744');
    var k0 = Math.floor((dist + NEAR) / 5), k1 = Math.ceil((dist + FAR) / 5);
    for (var k = k0; k < k1; k++) {
      var za = Math.max(NEAR, k * 5 - dist), zb = Math.min(FAR, (k + 1) * 5 - dist);
      if (zb <= za) continue;
      quad(P(-1, za), P(1, za), P(1, zb), P(-1, zb), (k & 1) ? '#e7d6b5' : '#dcc9a3');
    }
    g.strokeStyle = '#fff8e6'; g.lineWidth = 2; g.beginPath();
    g.moveTo(a[0], a[1]); g.lineTo(d[0], d[1]); g.moveTo(b[0], b[1]); g.lineTo(c2[0], c2[1]); g.stroke();
    // haze where the path fades into the distance
    var hz = g.createLinearGradient(0, HZ, 0, HZ + H * 0.09);
    hz.addColorStop(0, 'rgba(150,212,255,1)'); hz.addColorStop(1, 'rgba(150,212,255,0)');
    g.fillStyle = hz; g.fillRect(0, HZ - 4, W, H * 0.09 + 4);

    // world objects, far to near
    var vis = [];
    for (var i = 0; i < items.length; i++) {
      var z = items[i].z - dist;
      if (z < NEAR + 1 || z > FAR - 10) continue;
      vis.push([z, items[i]]);
    }
    vis.sort(function (p, q) { return q[0] - p[0]; });
    var drewPlayer = false;
    function player() {
      var p = P(px, 0);
      if (count > 0) crowd(p[0], p[1], 1, count, '#1f6fe5', '#ffd9b0', 0, fight ? -12 : 0);
      drewPlayer = true;
    }
    for (var v = 0; v < vis.length; v++) {
      var z2 = vis[v][0], it = vis[v][1];
      if (!drewPlayer && z2 < 0) player();
      if (it.k === 'gate') drawGate(it, z2);
      else if (!it.used && it.n > 0) {
        var q = P(it.x, z2);
        crowd(q[0], q[1], q[2], it.n, '#d93a3a', '#ffd9b0', 3, fight && fight.it === it ? 12 : 0);
      }
    }
    if (!drewPlayer) player();
    if (star) drawStomps();

    // fight particles
    for (var n = 0; n < parts.length; n++) {
      var pt = parts[n];
      g.globalAlpha = Math.max(0, 1 - pt.t / pt.life);
      g.fillStyle = pt.col; g.beginPath(); g.arc(pt.x, pt.y, pt.r, 0, 7); g.fill();
    }
    g.globalAlpha = 1;

    // popups
    for (var m = 0; m < pops.length; m++) {
      var po = pops[m], pp = P(px, 0);
      g.globalAlpha = 1 - po.t;
      g.font = '800 34px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(0,0,0,.4)'; g.fillText(po.text, pp[0] + 2, pp[1] - 110 - po.t * 60 + 2);
      g.fillStyle = po.col; g.fillText(po.text, pp[0], pp[1] - 110 - po.t * 60);
      g.globalAlpha = 1;
    }
    g.restore();

    // HUD
    g.fillStyle = 'rgba(14,26,43,.7)'; rr(12, 12, W - 24, 44, 12); g.fill();
    g.font = '700 16px system-ui, sans-serif'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.textAlign = 'left'; g.fillText(Math.floor(dist) + ' m', 26, 34);
    g.textAlign = 'center'; g.fillText('Squads beaten: ' + wins, W / 2, 34);
    g.textAlign = 'right'; g.fillText('Best: ' + Math.max(best, Math.floor(dist)) + ' m', W - 26, 34);
  }

  reset();
  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    if (W === 0) resize();
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
