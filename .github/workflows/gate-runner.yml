name: Build Gate Runner APK

on:
  push:
    paths:
      - 'gate-runner/**'
      - '.github/workflows/gate-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: a fixed signing key stored as repo secrets keeps updates installable
      # over older builds. Without it the build uses a throwaway debug key.
      - name: Restore signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -n "$SIGNING_KEY_B64" ]; then
            echo "$SIGNING_KEY_B64" | base64 -d > gate-runner/signing.jks
          fi

      - name: Build APK
        working-directory: gate-runner
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp gate-runner/app/build/outputs/apk/debug/app-debug.apk "GateRunner-1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GateRunner-apk
          path: GateRunner-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gate-runner-v1.${{ github.run_number }}" GateRunner-*.apk \
            --title "Gate Runner 1.${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
